name: API 延遲量測

# 量測各 API「資料時刻」與「實際抓得到的時刻」差幾分鐘，
# 用來決定抓取時間該排在幾分幾秒 —— 目前 delay 的根因是抓太早，
# 抓到的是上一輪的舊資料。
#
# ★ 這支只讀資料時刻、不改任何前端輸出，所以可以放心高頻跑。
# ★ 樣本要累積才有統計意義：每小時 1 筆，約 3 天（70 筆上下）
#   才看得出中位數與 90 百分位；在那之前不要據此改抓取時刻。
# ★ api_latency.json 會 commit 進 repo（純文字、每筆約 120 bytes，
#   14 天上限約 40KB），這樣才能在 Actions 頁面以外直接看到歷史。

on:
  schedule:
    # 每小時 1 筆，分鐘數刻意錯開整點（整點是 Actions 最壅塞的時刻，
    # 排整點等於把「量測延遲」的工具本身也塞進延遲裡）
    - cron: '23 * * * *'
  workflow_dispatch:

# 同時只跑一份，避免兩個 run 同時 commit 造成衝突
concurrency:
  group: api-latency
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      # ★ requests 不在標準庫，setup-python 給的是乾淨的 Python。
      #   先前漏了這一步，probe 的 `if not requests: return []` 靜默回空，
      #   於是「跑得很順、累積 0 筆」—— 整整幾天沒收集到任何東西。
      - name: 安裝相依套件
        run: pip install --quiet requests

      - name: 量測
        run: python probe_api_latency.py
        env:
          # ★ 變數名必須與 probe_api_latency.py 內的 os.environ.get 一致，
          #   名字打錯不會報錯，只會讓 CWA 那組樣本全部抓不到。
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

      - name: 印出目前統計
        run: python probe_api_latency.py --report || true

      - name: 回寫 api_latency.json
        run: |
          if [ -n "$(git status --porcelain api_latency.json)" ]; then
            git config user.name  "formosa-bot"
            git config user.email "formosa-bot@users.noreply.github.com"
            git add api_latency.json
            git commit -m "API 延遲量測 $(date -u '+%Y-%m-%dT%H:%MZ')"
            # ★ 與其他排程 workflow 併發時可能被搶先，故先 rebase 再推
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "本輪無新樣本（可能 API 未更新資料時刻）"
          fi
