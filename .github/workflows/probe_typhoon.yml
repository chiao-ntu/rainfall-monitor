name: 探測 颱風路徑資料

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run probe_typhoon2.py
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python probe_typhoon2.py
