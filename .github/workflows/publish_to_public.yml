name: 發布到公開 repo

# ★ 這一支是「完整的 workflow」，放到 .github/workflows/ 就能用。
#   （先前給的 publish_step.yml 是「要貼進既有 workflow 的片段」，
#     放進 .github/workflows/ 會出現 "A sequence was not expected" —— 那是
#     因為它開頭就是 `- name:`，YAML 最外層不能是序列。那個檔請從
#     .github/workflows/ 移除。）
#
# ★ 分鐘數說明：獨立 workflow 每次執行會多算一個 job（不足一分鐘也算一分鐘）。
#   公開 repo 的 Actions 不限額度，所以現在這樣用沒有成本。
#   等 repo 轉為私有（免費額度 2,000 分/月）之後，建議改用片段版
#   publish_step.txt 併進抓資料那支，省下每月約 720 分鐘。
#
# 需要的 secret：PUBLISH_TOKEN
#   fine-grained PAT，權限只給「公開 repo 的 Contents: write」。
#   不要用碰得到私有 repo 的 token —— 那等於把要保密的東西交給發布流程。

env:
  PUBLIC_REPO: your-account/formosa        # ← 改成你的公開 repo
  PUBLIC_BRANCH: main

on:
  workflow_dispatch:
  # 抓資料那支跑完就發布。名稱必須與該 workflow 的 `name:` 完全一致；
  # 填錯不會報錯，只是永遠不觸發 —— 所以下面另外保留 schedule 當後備。
  workflow_run:
    workflows: ["資料更新"]                 # ← 改成你抓資料那支的 name
    types: [completed]
  schedule:
    - cron: '41 * * * *'                   # 後備：每小時一次，避開整點壅塞

permissions:
  contents: read        # 只讀本 repo；寫入公開 repo 走 PAT

concurrency:
  group: publish-public
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 由抓資料觸發時，那一輪失敗就不要發布（避免把壞資料推上線）
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: 發布
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          # 前端成品：有 public/index.html 就用它（已剝註解的版本），
          # 沒有就用 index.html 原檔 —— 先做 repo 拆分、之後再加剝註解，
          # 這一步都不必改。
          SRC_HTML="index.html"
          [ -s public/index.html ] && SRC_HTML="public/index.html"
          echo "前端來源：${SRC_HTML}"

          git clone --depth 1 --branch "${PUBLIC_BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" pub

          cp "${SRC_HTML}" pub/index.html

          # 固定圖資與疊圖（很少變，一起帶過去）
          for f in town_polys.json east_asia_geo.json town_terrain2.json \
                   terrain_zones_4class.json terrain_relief.json terrain_relief.png \
                   landslide_warning_stations.json coast_dist_final.json \
                   roads_major.geojson shelters.geojson robots.txt; do
            [ -f "$f" ] && cp "$f" "pub/$f" || true
          done
          [ -d vendor ] && mkdir -p pub/vendor && cp -r vendor/. pub/vendor/ || true

          # ── 每輪變動的資料 ──
          # ★ 逐檔檢查「存在、非空、且是合法 JSON」才推。某輪某來源抓取失敗時，
          #   寧可讓公開版沿用上一輪，也不要推空檔或半截檔 ——
          #   推上去就是全體使用者看到壞資料。
          ok=0; skip=0
          for f in data.json radar.json rain_hourly.json etr2_now.json \
                   verify.json typhoon_now.json env_hist.json wind_hist.json \
                   debris_geo.json landslide_geo.json forecast_log.json; do
            if [ -s "$f" ] && python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              cp "$f" "pub/$f"; ok=$((ok+1))
            else
              [ -e "$f" ] && echo "跳過 $f（空檔或非合法 JSON）" || true
              skip=$((skip+1))
            fi
          done
          echo "資料檔：推送 ${ok} 個、跳過 ${skip} 個"

          # ★ data.json 是核心，它壞掉整站不能用，不接受靜默沿用
          if [ ! -s pub/data.json ]; then
            echo "pub/data.json 不存在 —— 中止發布" >&2
            exit 1
          fi

          # ★ 不做 rsync --delete：公開 repo 裡有 CNAME 等不是這裡產生、
          #   但不該被刪的檔案。
          cd pub
          if [ -z "$(git status --porcelain)" ]; then
            echo "無變動，不發布"; exit 0
          fi
          git config user.name  "formosa-bot"
          git config user.email "formosa-bot@users.noreply.github.com"
          git add -A
          # ★ commit 訊息不要帶方法細節：公開 repo 的 git log 是看得到的
          git commit -m "更新 $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push
