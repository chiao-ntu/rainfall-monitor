# FORMOSA 鏡像站（GitLab Pages）
#
# 用途：GitHub Pages 或 GitHub Actions 出狀況時的備援站台。
# 設定方式（一次性）：
#   1. GitLab 建立專案 → Settings → Repository → Mirroring repositories
#      選 "Pull"，填 GitHub repo 網址 → GitLab 會自動同步（預設每 5 分鐘）
#   2. Settings → CI/CD → Variables 新增 CWA_API_KEY（勾 Masked）
#      ★ 只有要讓 GitLab 也自己抓資料時才需要；純鏡像可以不填
#   3. 推一次即會部署到 https://<帳號>.gitlab.io/<專案>/
#
# 兩種模式，依需求擇一（預設是 pages，最省事）：
#   pages      ── 純鏡像：只提供網頁，資料由 GitHub 同步過來
#   fetch:data ── 獨立抓資料：GitHub Actions 掛掉時仍能自行更新
#                 （手動觸發或取消下面 rules 的註解改為排程）

stages: [build, deploy]

# ── 純鏡像：把 repo 內容原樣發佈 ──────────────────────────
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    # ★ vendor/ 一定要帶：地圖元件已改為本站提供，漏了整頁不能用
    - cp -r index.html vendor public/ 2>/dev/null || true
    - cp *.json public/ 2>/dev/null || true
    - cp *.png public/ 2>/dev/null || true
    - cp taiwan_blank_map.html public/ 2>/dev/null || true
    - ls -la public/ | head -20
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── 獨立抓資料（備援排程）────────────────────────────────
# 平時不跑，GitHub Actions 故障時到 CI/CD → Pipelines → Run pipeline
# 手動觸發；或在 Settings → CI/CD → Pipeline schedules 設定每小時。
fetch:data:
  stage: build
  image: python:3.11-slim
  variables:
    GIT_STRATEGY: clone
  script:
    - pip install --no-cache-dir requests numpy pillow
    - python fetch_rainfall.py
    - test -f data.json || (echo "data.json 未產出，中止" && exit 1)
    - |
      git config user.name  "gitlab-ci"
      git config user.email "ci@gitlab"
      git add data.json
      for f in obs_history.json model_skill.json verify.json forecast_log.json; do
        [ -f "$f" ] && git add "$f"
      done
      git diff --cached --quiet && echo "無變更" && exit 0
      git commit -m "備援更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') TST"
      git push "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "HEAD:${CI_DEFAULT_BRANCH}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
