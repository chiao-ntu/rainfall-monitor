name: Probe QPF

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run probe
        env:
          CWA_KEY: ${{  secrets.CWA_API_KEY  }}
        run: python probe_swcb_qpf.py
