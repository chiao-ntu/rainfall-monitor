# 把這一步加到你「抓資料」那支 workflow 的最後面（私有 formosa-core repo 裡）。
# 不是獨立的 workflow —— 獨立就要多開一個 job，每次多算一分鐘。
#
# 分工：這一步只推「資料」。程式碼由 publish_public.yml 在真的改動時才發布。
#   資料：逐時、很便宜（純 git push，約 1 分鐘）
#   程式碼：很少改、但建置＋測試要 3–5 分鐘
# 混在一起跑，2,000 分鐘/月的免費額度會被建置吃光。
#
# 需要的 secret：PUBLISH_TOKEN（fine-grained PAT，只給公開 repo 的 Contents: write）

      - name: 推送資料到公開 repo
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLIC_REPO: your-account/formosa      # ← 改成你的公開 repo
          PUBLIC_BRANCH: main
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${PUBLIC_BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" pub

          # ★ 只複製確實存在的檔案。某輪某個來源抓取失敗時，
          #   寧可讓公開版沿用上一輪的那個檔，也不要推一個空檔或半截檔上去
          #   —— 推上去就是全體使用者看到壞資料。
          pushed=0
          for f in data.json radar.json rain_hourly.json etr2_now.json \
                   verify.json typhoon_now.json env_hist.json wind_hist.json \
                   debris_geo.json landslide_geo.json forecast_log.json; do
            if [ -s "$f" ] && python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$f"; then
              cp "$f" "pub/$f"; pushed=$((pushed+1))
            else
              echo "跳過 $f（不存在、為空、或不是合法 JSON）"
            fi
          done
          echo "可推送檔案 ${pushed} 個"

          cd pub
          if [ -z "$(git status --porcelain)" ]; then
            echo "資料無變動，不推送"; exit 0
          fi
          git config user.name  "formosa-bot"
          git config user.email "formosa-bot@users.noreply.github.com"
          git add -A
          git commit -m "資料更新 $(date -u '+%Y-%m-%dT%H:%MZ')"
          git push
